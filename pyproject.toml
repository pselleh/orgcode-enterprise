[project]
name = "tutor-orgcode-enterprise"
version = "1.1.1"
description = "OrgCode Enterprise Tutor Plugin"
requires-python = ">=3.11"

[project.entry-points."tutor.plugin.v1"]
orgcode_enterprise = "orgcode_enterprise.plugin"

[project.entry-points."lms.djangoapp"]
orgcode_enterprise = "orgcode_enterprise.app_config:OrgcodeEnterpriseConfig"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["orgcode_enterprise*"]
